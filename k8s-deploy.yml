name: K8s Deploy
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      - name: Set Context
        run: |
          # Custom logic to auth with AWS EKS or GKE
          echo "Deploying to ${{ inputs.cluster_name }}..."
      - name: Rollout Update
        run: |
          kubectl set image deployment/app app=${{ vars.REGISTRY_URL }}:${{ github.sha }}
